<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iglesia Eben-Ezer | Misión y Visión</title>
        <style>
:root {
    --primary: #124490;
    --primary-dark: #0b2f67;
    --accent: #d2a126;
    --bg: #f5f7fb;
    --white: #ffffff;
    --text: #1d2430;
    --muted: #5c6675;
    --border: #dfe5ef;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    color: var(--text);
    background-color: var(--bg);
    line-height: 1.6;
}

.site-header {
    background: linear-gradient(120deg, var(--primary-dark), var(--primary));
    color: var(--white);
    padding: 20px 16px;
}

.brand-wrap {
    max-width: 1100px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 16px;
}

.logo {
    width: 88px;
    height: 88px;
    object-fit: contain;
    background-color: var(--white);
    border-radius: 50%;
    padding: 6px;
}

h1,
h2,
h3 {
    margin-top: 0;
}

.site-header p {
    margin: 6px 0 0;
    color: #dbe8ff;
}

.main-nav {
    background-color: var(--white);
    border-bottom: 3px solid var(--accent);
    padding: 12px;
    text-align: center;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
}

.main-nav a {
    color: var(--primary-dark);
    margin: 0 10px;
    text-decoration: none;
    font-weight: 700;
}

.main-nav a:hover {
    color: var(--accent);
}

.dropdown {
    position: relative;
    display: inline-block;
}

.dropbtn {
    border: 0;
    background-color: transparent;
    color: var(--primary-dark);
    font-weight: 700;
    font-size: 1rem;
    padding: 8px 10px;
    cursor: pointer;
}

.dropbtn:hover {
    color: var(--accent);
}

.dropdown-menu {
    display: none;
    position: absolute;
    left: 0;
    top: 100%;
    min-width: 220px;
    background-color: var(--white);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: 0 12px 20px rgba(11, 47, 103, 0.12);
    z-index: 50;
    padding: 8px 0;
}

.dropdown-menu a {
    display: block;
    margin: 0;
    padding: 10px 14px;
    text-align: left;
}

.dropdown:hover .dropdown-menu,
.dropdown:focus-within .dropdown-menu {
    display: block;
}

.container {
    max-width: 1100px;
    margin: 24px auto;
    padding: 0 16px;
}

.card {
    background-color: var(--white);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 22px;
    margin-bottom: 18px;
    box-shadow: 0 4px 16px rgba(18, 68, 144, 0.08);
}

.hero h2 {
    color: var(--primary);
}

.hero-banner {
    padding: 0;
    overflow: hidden;
    position: relative;
}

.hero-image {
    width: 100%;
    height: 430px;
    object-fit: cover;
    display: block;
    filter: brightness(0.68);
}

.hero-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 8px;
    padding: 28px;
    color: var(--white);
}

.hero-overlay h2 {
    margin: 0;
    font-size: 2rem;
}

.hero-overlay p {
    max-width: 680px;
    margin: 0;
}

.btn-primary {
    display: inline-block;
    margin-top: 8px;
    background-color: var(--accent);
    color: #2c2000;
    text-decoration: none;
    padding: 10px 16px;
    border-radius: 8px;
    font-weight: 700;
}

.btn-primary:hover {
    background-color: #c18f14;
}

.actividades {
    width: 100%;
    max-width: 420px;
    height: auto;
    border-radius: 10px;
    border: 1px solid var(--border);
    margin: 8px 0 10px;
}

.facebook {
    width: 54px;
    height: 54px;
    object-fit: contain;
}

.ministry-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 16px;
}

.ministry-card h3 {
    color: var(--primary);
}

.ministry-list {
    display: flex;
    flex-direction: column;
    gap: 16px;
}

.ministry-row {
    display: grid;
    grid-template-columns: 240px 1fr;
    gap: 18px;
    align-items: center;
}

.ministry-thumb {
    width: 100%;
    height: 170px;
    object-fit: cover;
    border-radius: 10px;
    border: 1px solid var(--border);
}

.ministry-content h3 {
    color: var(--primary);
    margin-bottom: 8px;
}

.modal-overlay {
    position: fixed;
    inset: 0;
    background-color: rgba(0, 0, 0, 0.55);
    display: none;
    justify-content: center;
    align-items: center;
    padding: 16px;
    z-index: 999;
}

.modal-overlay.is-visible {
    display: flex;
}

.modal-box {
    width: 100%;
    max-width: 520px;
    background-color: var(--white);
    border-radius: 14px;
    padding: 20px;
    position: relative;
    box-shadow: 0 16px 32px rgba(0, 0, 0, 0.18);
}

.modal-box h3 {
    margin-bottom: 8px;
    color: var(--primary);
}

.modal-close {
    position: absolute;
    top: 10px;
    right: 12px;
    border: 0;
    background: transparent;
    font-size: 1.4rem;
    cursor: pointer;
    color: var(--muted);
}

.event-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 16px;
}

.event-card {
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    background-color: #fbfdff;
}

.event-card h3 {
    color: var(--primary);
    margin-bottom: 8px;
}

footer {
    text-align: center;
    font-weight: 700;
    color: var(--muted);
    padding: 22px 16px 28px;
}

@media (max-width: 768px) {
    .brand-wrap {
        flex-direction: column;
        text-align: center;
    }

    .main-nav {
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .main-nav a {
        margin: 0;
    }

    .dropdown,
    .dropbtn {
        width: 100%;
    }

    .dropbtn {
        text-align: center;
        padding: 0;
    }

    .hero-image {
        height: 320px;
    }

    .hero-overlay h2 {
        font-size: 1.45rem;
    }

    .ministry-grid {
        grid-template-columns: 1fr;
    }

    .ministry-row {
        grid-template-columns: 1fr;
    }

    .ministry-thumb {
        height: 210px;
    }

    .event-grid {
        grid-template-columns: 1fr;
    }
}

    </style>
</head>
<body>
    <header class="site-header">
        <div class="brand-wrap">
            <a href="index.html"><img src="LOGOS EBEN CON BORDE.png" class="logo" alt="Logo Iglesia Eben-Ezer"></a>
            <div>
                <h1>Misión y Visión</h1>
                <p>La identidad espiritual y el propósito de nuestra iglesia</p>
            </div>
        </div>
    </header>

    <nav class="main-nav">
        <div class="dropdown">
            <button class="dropbtn" type="button">Quiénes somos</button>
            <div class="dropdown-menu">
                <a href="historia.html">Historia</a>
                <a href="mision-vision.html">Misión y visión</a>
                <a href="contacto.html">Contacto</a>
            </div>
        </div>
        <a href="ministerios.html">Ministerios y direcciones</a>
        <a href="eventos.html">Eventos</a>
        <a href="contacto.html">Contacto</a>
    </nav>

    <main class="container">
        <section class="card">
            <h2>Misión</h2>
            <p>Texto de ejemplo en español.</p>
        </section>

        <section class="card">
            <h2>Visión</h2>
            <p>Texto de ejemplo en español.</p>
        </section>
    </main>

    <footer>
        <p>© 2026 - Iglesia Eben-Ezer | Todos los derechos reservados</p>
    </footer>
</body>
</html>
